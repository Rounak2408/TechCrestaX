<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & Brand Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="color-scheme" content="light" />

    <!-- SEO Meta Tags -->
    <title>TechCrestaX — Modern Web Engineering & Digital Transformation Studio</title>
    <meta
      name="description"
      content="TechCrestaX is a premier digital engineering studio specializing in high-performance web applications, conversion-engineered website development, UI/UX systems, and scalable digital solutions."
    />
    <meta name="keywords" content="TechCrestaX, web development, custom software, UI/UX design, React, Next.js, digital transformation, Rajkot, India, web design agency, SaaS engineering" />
    <meta name="author" content="TechCrestaX Redesign Concept" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.techcrestax.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.techcrestax.com/" />
    <meta property="og:title" content="TechCrestaX — Modern Web Engineering & Digital Studio" />
    <meta
      property="og:description"
      content="High-performance websites, scalable web applications, and conversion-focused digital experiences engineered for modern business."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:site_name" content="TechCrestaX" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechCrestaX — Modern Web Engineering & Digital Studio" />
    <meta
      name="twitter:description"
      content="High-performance websites, scalable web applications, and conversion-focused digital experiences engineered for modern business."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Google Fonts Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope (Modern, approachable, professional sans-serif) & JetBrains Mono (Tech/Metrics) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#fafaf9] text-[#1e293b] antialiased selection:bg-[#ccff00]/40 selection:text-[#0f172a] min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Window error detected:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px 20px;max-width:640px;margin:80px auto;font-family:sans-serif;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.05);text-align:center;">' +
            '<h2 style="color:#0f172a;margin-bottom:8px;">Interface Loading Error</h2>' +
            '<p style="color:#64748b;font-size:14px;margin-bottom:16px;">' + (event.message || 'Script execution error') + '</p>' +
            '<button onclick="location.reload()" style="padding:10px 24px;background:#0f172a;color:#fff;border:none;border-radius:9999px;font-weight:600;cursor:pointer;">Reload Page</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
