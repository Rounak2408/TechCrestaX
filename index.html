<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon & Official Brand Icon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#05080D" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO Meta Tags based on Official TechCrestaX Positioning -->
    <title>TechCrestaX — Website Development, App Development & Digital Solutions</title>
    <meta
      name="description"
      content="TechCrestaX builds digital solutions that move businesses forward. Digital agency based in Rajkot, Gujarat specializing in custom website design & development, e-commerce, web applications, UI/UX design, and technical SEO."
    />
    <meta name="keywords" content="TechCrestaX, website design and development, ecommerce website development, web applications and platforms, UI UX design, SEO local SEO, digital growth, Rajkot Gujarat, web development agency" />
    <meta name="author" content="TechCrestaX" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.techcrestax.com/" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.techcrestax.com/" />
    <meta property="og:title" content="TechCrestaX — Website Development & Digital Solutions" />
    <meta
      property="og:description"
      content="We build websites that move your businesses forward. Fast execution, premium design, secure development, and dedicated post-launch support."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:site_name" content="TechCrestaX" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TechCrestaX — Website Development & Digital Solutions" />
    <meta
      name="twitter:description"
      content="We build websites that move your businesses forward. Fast execution, premium design, secure development, and dedicated post-launch support."
    />
    <meta name="twitter:image" content="https://www.techcrestax.com/logo.png" />

    <!-- Static Baseline Schema.org Structured Data for Crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": ["Organization", "ProfessionalService"],
          "@id": "https://www.techcrestax.com/#organization",
          "name": "TechCrestaX",
          "url": "https://www.techcrestax.com",
          "logo": "https://www.techcrestax.com/logo.png",
          "description": "TechCrestaX is a digital solutions and web development company based in Rajkot, Gujarat, India, specializing in custom website development, scalable applications, AI automation, and cloud solutions.",
          "email": "techcrestax@gmail.com",
          "telephone": "+91 83404 26550",
          "foundingDate": "2026",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Rajkot",
            "addressRegion": "Gujarat",
            "addressCountry": "IN"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.techcrestax.com/#website",
          "url": "https://www.techcrestax.com/",
          "name": "TechCrestaX"
        }
      ]
    }
    </script>

    <!-- Brand Asset Preload -->
    <link rel="preload" as="image" href="/logo.png" type="image/png" />

    <!-- Google Fonts DNS Prefetch & Preconnect -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Non-render-blocking Google Fonts (Poppins & JetBrains Mono) with swap -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body class="bg-white text-[#1e293b] antialiased selection:bg-[#FFD4C9] selection:text-[#0f172a] min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(event) {
        console.error('Window error detected:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="padding:40px 20px;max-width:640px;margin:80px auto;font-family:sans-serif;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.05);text-align:center;">' +
            '<h2 style="color:#0f172a;margin-bottom:8px;">Interface Loading Error</h2>' +
            '<p style="color:#64748b;font-size:14px;margin-bottom:16px;">' + (event.message || 'Script execution error') + '</p>' +
            '<button onclick="location.reload()" style="padding:10px 24px;background:#0f172a;color:#fff;border:none;border-radius:9999px;font-weight:600;cursor:pointer;">Reload Page</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
